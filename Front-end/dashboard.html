<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" href="css/style-dashboard.css" />
    <title>Vitalys</title>
  </head>
  <body>
    <header>
      <img
        src="img/logo-vitalys-light.png"
        class="logoClinica"
        alt="Logo Vitalys"
      />

      <nav class="menuNavegacao">
        <a href="#">Início</a><!--tela com frase-->
        <a href="#">Pacientes</a><!---->
        <a href="#">Agendamentos</a> <!--novo agendamento/buscar agendamento-->
        <a href="#">Profissionais</a><!---->
        <a href="#">Calendário</a><!---->
      </nav>

      <span>Vitalys - Portal do Funcionário</span>
      <button id="theme-toggle" class="botaoTema" title="Alternar tema">
        <svg
          id="theme-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
    </header>

    <!--section-->

    <main>
      <!--INICIO-->
      <section id="inicio" class="tela-conteudo">
        <h2>Vitalys: Um espaço dedicado ao cuidado, à saúde e à vida.</h2>

      </section>

      <!--PACIENTES-->
      <section id="pacientes" class="tela-conteudo">

      </section>

      <!--AGENDAMENTOS-->

      <section id="agendamentos" class="tela-conteudo">

      </section>

      <!--PROFISSIONAIS-->
      <section id="profissionais" class="tela-conteudo">

      </section>
      <!--CALENDARIO-->
      <section id="calendario" class="tela-conteudo">

      </section>



    </main>

    <script src="scripts/script.js"></script>
  </body>
</html>
