<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Vitalys</title>
  </head>
  <body>
    <header>
      <img
        src="img/logo-vitalys.png"
        class="logoClinica"
        alt="Logo da clínica Vitalys"
      />
      <span>Vitalys - Portal do Funcionário</span>
    </header>

    <main>
      <section class="login">
        <h1>Login</h1>

        <form action="#" method="post">
          <label for="email">Email:</label>
          <input type="email" name="userEmail" id="email" required />
          <br />

          <label for="password">Senha:</label>
          <input type="password" name="userPassword" id="password" required />
          <br />

          <div class="login-actions">
            <button type="submit" class="botaoEntrar" id="enviarLogin">
              Entrar
            </button>
            <a href="#" class="link-forgot">Esqueci minha senha</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
