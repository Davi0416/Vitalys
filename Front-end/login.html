<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" href="css/style-login.css" />
    <title>Vitalys</title>
  </head>
  <body>

    <header>
      <img src="img/logo-vitalys-light.png" class="logoClinica" alt="Logo Vitalys" />

      <span>Vitalys - Portal do Funcionário</span>
      <button id="theme-toggle" class="botaoTema" title="Alternar tema">
  <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  </svg>
</button>

    </header>

    <main>
      <section class="login">
        <h1>Login</h1>

        <form action="#" method="post">
          <label for="email">Login:</label>
          <input type="text" name="userEmail" id="email" required autocomplete="username" />

          <label for="password">Senha:</label>
          <input type="password" name="userPassword" id="password" required autocomplete="current-password" />

          <p id="msgErroLogin" style="color: var(--cor-erro, #e05555); font-size: 0.875rem; min-height: 1.2em;"></p>

          <div class="login-actions">
            <button type="submit" class="botaoEntrar" id="enviarLogin">
              Entrar
            </button>
            <a href="#" class="link-forgot">Esqueci minha senha</a>
          </div>
        </form>
      </section>
    </main>

    <script src="scripts/login.js"></script>
  </body>
</html>
