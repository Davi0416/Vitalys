<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" href="css/style-login.css" />
    <title>Vitalys</title>
  </head>
  <body>

    <!-- Brand strip -->
    <div class="login-brand-strip">
      <img src="img/logo-vitalys-light.png" class="login-logo-img" alt="Vitalys" />
      <span class="login-brand-desc">Portal interno · clínicas multidisciplinares</span>
      <button id="theme-toggle" class="botaoTema" title="Alternar tema">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>

    <main>
      <section class="login">

        <!-- Ícone da marca -->
        <div class="login-brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M3 12h4l2-5 3 10 2-5h7" stroke="white" stroke-width="2.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h1>Bem-vindo de volta</h1>
        <span class="login-subtitle">Entre com suas credenciais para acessar o portal.</span>

        <form action="#" method="post">

          <div class="field-group">
            <label for="login">Usuário</label>
            <div class="field-wrap">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
              </svg>
              <input type="text" name="userLogin" id="login"
                     placeholder="seu.usuario" required autocomplete="username" />
            </div>
          </div>

          <div class="field-group">
            <div class="field-label-row">
              <label for="password">Senha</label>
              <a href="#" class="link-forgot">Esqueci minha senha</a>
            </div>
            <div class="field-wrap">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="2"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
              </svg>
              <input type="password" name="userPassword" id="password"
                     placeholder="••••••••" required autocomplete="current-password" />
            </div>
          </div>

          <p id="msgErroLogin"></p>

          <button type="submit" class="botaoEntrar" id="enviarLogin">
            Entrar no portal
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          </button>

        </form>

        <div class="login-card-footer">
          Problemas para acessar?
          <a href="#">Fale com o suporte</a>
        </div>

      </section>
    </main>

    <div class="login-copyright">
      © 2026 Vitalys · Dados protegidos por criptografia ponta a ponta
    </div>

    <script src="scripts/login.js"></script>
  </body>
</html>
