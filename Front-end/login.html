<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Vitalys</title>
  </head>
  <body>
    <header>
      <img src="" alt="Logo da clínica Vitalys" />
    </header>

    <section class="login">
      <h1>Login</h1>

      <form action="#" method="post">
        <label for="email">Email:</label>
        <input type="email" name="userEmail" id="email" required/>
        <br />

        <label for="password">Senha:</label>
        <input type="password" name="userPassword" id="password" required/>
        <br>

        <div class="login-actions">
            <button type="submit" class="botaoEntrar" id="enviarLogin">Entrar</button>
            <a href="recuperar-senha.html" class="link-forgot">Esqueci minha senha</a>
        </div>

      </form>
    </section>
  </body>
</html>
